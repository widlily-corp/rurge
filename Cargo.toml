[workspace]
resolver = "2"
members = [
    "crates/rurge-api",
    "crates/rurge-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Rurge Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rurge/rurge"

[workspace.dependencies]
abi_stable = "0.11"
serde = { version = "1.0", features = ["derive"] }
