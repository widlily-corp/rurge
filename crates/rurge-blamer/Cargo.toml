[package]
name = "rurge-blamer"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Panic boundary wrapper and mod blamer diagnostics for Rurge mod loader"

[dependencies]
thiserror = "2.0"
parking_lot = "0.12"
backtrace = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1.0", features = ["derive"] }
