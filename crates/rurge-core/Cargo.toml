[package]
name = "rurge-core"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core runtime engine, event bus and registry system for Rurge mod loader"

[dependencies]
rurge-api = { path = "../rurge-api" }
parking_lot = "0.12"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
petgraph = "0.6"
semver = { version = "1.0", features = ["serde"] }
toml = "0.8"
