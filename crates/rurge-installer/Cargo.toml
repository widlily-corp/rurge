[package]
name = "rurge-installer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sha1 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
zip = "2.2"
ureq = { version = "2.10", features = ["json"] }
log = "0.4"
env_logger = "0.11"
